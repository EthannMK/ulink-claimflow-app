<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">

                        "on-tertiary-container": "#e9b268",
                        "secondary-fixed": "#abeef0",
                        "tertiary-fixed-dim": "#f5bc72",
                        "on-primary-fixed-variant": "#184974",

                        "status-pending": "#D97706",
                        "primary-fixed-dim": "#a0cafc",

                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "inspector-width": "380px",
                        "container-padding": "24px",
                        "pane-gap": "16px",
                        "base": "4px",
                        "sidebar-width": "260px"
                    },
                    "fontFamily": {
                        "title-lg": ["Inter"],
                        "headline-sm": ["Hanken Grotesk"],
                        "label-md": ["Inter"],

            }
        }

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        .soft-ambient-shadow {
            box-shadow: 0px 4px 12px rgba(31, 78, 121, 0.08);
        }

        .input-glow:focus-within {
            box-shadow: 0 0 0 2px rgba(0, 55, 94, 0.2);
            border-color: theme('colors.primary');
        }
    </style>

<body class="bg-[#F5F7FA] text-on-surface min-h-screen flex items-center justify-center p-4 antialiased">
<!-- Login Container -->
<div class="w-full max-w-md bg-surface-container-lowest rounded-xl soft-ambient-shadow border border-outline-variant p-8 md:p-10 relative overflow-hidden">
<!-- Subtle Top Accent -->
<div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-primary to-secondary"></div>
<!-- Logo Area -->
<div class="flex flex-col items-center mb-8">
<div class="mb-4 flex items-center justify-center" style="width: 140px; height: 40px;"><img src="https://lh3.googleusercontent.com/aida-public/AB6AXuB9U-SwjeGiPTdWYzvA-bVAhPYWP2-ANj-49BPCkYMX_ZNI-I_SksGkejk-VmTDBR5JabYIva9ao66KnGrIX3NWBZyHdZXFBrwKFmXbmlNkGusQYQzWUFbj3S6xJyjn00CM4Cg3H6IA94fdPUHBL1vp6dYKdBP1c8ZZwgsKmuA4Iky2Q8HNns771n1lz5xYUIFOeSlnWyhMKSyTWy-6k45edkqbDxZ8TrgsfYJWECKO_gSZdfm2G-2D-h0p5um5qkbOSw" alt="Ulink Assist Logo" class="max-w-full max-h-full object-contain"></div>
<h1 class="font-headline-md text-headline-md text-primary text-center">Ulink Assist</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-2 text-center">Omnichannel Workspace</p>
</div>
<!-- Login Form -->
<form class="space-y-6">
<!-- Email Field -->
<div class="space-y-1">
<label class="font-label-md text-label-md text-text-main block" for="email">Email Address</label>
<div class="relative input-glow rounded transition-all duration-200 border border-outline-variant bg-surface-container-lowest">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-[20px]">mail</span>
</div>
<input class="w-full pl-10 pr-4 py-2 bg-transparent border-none focus:ring-0 font-body-md text-body-md text-on-surface rounded placeholder:text-outline-variant" id="email" name="email" placeholder="administrator@ulink.com" required="" type="email">
</div>
</div>
<!-- Password Field -->
<div class="space-y-1">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-text-main block" for="password">Password</label>
<a class="font-label-md text-label-md text-primary hover:text-secondary transition-colors" href="#">Forgot password?</a>
</div>
<div class="relative input-glow rounded transition-all duration-200 border border-outline-variant bg-surface-container-lowest">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-[20px]">lock</span>
</div>
<input class="w-full pl-10 pr-10 py-2 bg-transparent border-none focus:ring-0 font-body-md text-body-md text-on-surface rounded placeholder:text-outline-variant" id="password" name="password" placeholder="••••••••" required="" type="password">
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-outline hover:text-on-surface transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center">
<input class="h-4 w-4 text-primary focus:ring-primary border-outline-variant rounded bg-surface-container-lowest cursor-pointer" id="remember-me" name="remember-me" type="checkbox">
<label class="ml-2 block font-body-sm text-body-sm text-on-surface-variant cursor-pointer" for="remember-me">
                    Remember me on this device
                </label>
</div>
<!-- Submit Button -->
<div>
<button class="w-full flex justify-center py-2.5 px-4 border border-transparent rounded bg-primary text-on-primary font-label-md text-label-md hover:bg-surface-tint focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors shadow-sm" type="submit">
                    Sign In to Workspace
                </button>
</div>
</form>
<!-- Footer Note -->
<div class="mt-8 pt-6 border-t border-outline-variant text-center">
<p class="font-label-sm text-label-sm text-outline flex items-center justify-center gap-1">
<span class="material-symbols-outlined fill text-[14px] text-secondary">verified_user</span>
                Secure Enterprise Portal
            </p>
</div>
</div>


</body></html>
